# GitHub Pages (Jekyll) ビルド設定
# ここに挙げたファイル/フォルダは公開サイト（https://immersamap.github.io/...）に
# 配信されなくなります（URLでアクセスすると 404）。
# ただしリポジトリ内には残るため、git / Claude Code からは引き続き編集・参照できます。
exclude:
  # 内部ドキュメント一式（docs/ 配下はすべて非公開）
  - docs/
  # ローカル管理用ファイル
  - CLAUDE.md
  - .env.example
  # バックアップ
  - index.full.html.bak
  # SQL（DBスキーマ・セットアップ）
  - aerial_update.sql
  - category_update.sql
  - category_v2.sql
  - fix_categories.sql
  - historical_maps_setup.sql
  - schema_v2.sql
  # テスト・デモ用ページ
  - aerial-test.html
  - old-map-demo.html
  # テストコードと、その依存の一覧
  - tests/
  - requirements-dev.txt
  # 管理用ツール
  - admin/
  # 制作途中のため非公開（「地図上で旅をする」構想の試作。内容が固まるまで公開しない）
  - ryoma/
  - okunohosomichi/
  - kawagoe.html
  - kawagoe.jpg
