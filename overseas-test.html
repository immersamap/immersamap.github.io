<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 試作のアドレス。公開した新しいアドレスへ転送する（共有済みのリンクを切らない。仕様 docs/spec/release_overseas_en.md）
     GitHub Pages はページごとの HTTP 転送ができないので、JavaScript（?lang=en なら英語へ・# は引き継ぐ）と meta refresh で転送する -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://immersamap.github.io/overseas/">
<title>ImmersaMap ｜ 移動しました</title>
<script>
  location.replace((new URLSearchParams(location.search).get('lang') === 'en' ? 'en/overseas/' : 'overseas/') + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=overseas/">
</head>
<body>
<p>海外の空中写真・古地図の試作は <a href="overseas/">新しいアドレス</a> に移りました。English: <a href="en/overseas/" hreflang="en" lang="en">en/overseas/</a></p>
</body>
</html>
