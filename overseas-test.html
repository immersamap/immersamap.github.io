<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ImmersaMap ｜ 海外の空中写真（試作）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  [hidden]{display:none !important;}
  :root{
    --bg:#ffffff; --bg-alt:#fafafa; --border:#e5e5e5; --text:#1a1a1a; --muted:#666;
    --accent:#1a1a1a; --warn-bg:#fff6e5; --warn:#8a5a00; --off:#c8c8c8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg);}
  #map{position:absolute;inset:0;background:#e8e8e8;}

  #panel{
    position:absolute;top:12px;left:12px;z-index:1000;width:340px;max-width:calc(100vw - 24px);
    max-height:calc(100vh - 24px);overflow:auto;
    background:var(--bg);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px 16px;
  }
  h1{margin:0;font-size:15px;}
  .badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#1a1a1a;color:#fff;font-size:10px;vertical-align:2px;}
  .lead{margin:4px 0 0;font-size:12px;color:var(--muted);}
  .group{margin-top:14px;}
  .label{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  button.chip{
    flex:1;min-width:0;padding:7px 8px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg-alt);color:var(--text);font:inherit;font-size:12px;cursor:pointer;
  }
  button.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
  .now{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .now strong{font-size:20px;}
  .now span{font-size:12px;color:var(--muted);}
  input[type=range]{width:100%;}
  .ticks{position:relative;height:14px;margin:0 8px;}
  .ticks i{position:absolute;top:2px;width:2px;height:8px;margin-left:-1px;background:var(--text);}
  .ticks i.off{background:var(--off);}
  .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
  .msg{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:12px;background:var(--warn-bg);color:var(--warn);}
  .src{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5;}
  .src a{color:inherit;}
  @media (max-width:600px){
    #panel{top:auto;bottom:12px;max-height:55vh;}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>海外の空中写真<span class="badge">試作</span></h1>
  <p class="lead">日本・スイス・フランスの昔の空中写真を、同じ画面で見比べる試作です。</p>

  <div class="group">
    <div class="label">場所</div>
    <div class="row" id="places"></div>
  </div>

  <div class="group">
    <div class="label">年代の並べ方</div>
    <div class="row">
      <button class="chip" id="mode-a" data-mode="A" aria-pressed="true">A 国ごとの年</button>
      <button class="chip" id="mode-b" data-mode="B" aria-pressed="false">B 年代でそろえる</button>
    </div>
  </div>

  <div class="group">
    <div class="label" id="country-label">国</div>
    <div class="now"><strong id="era-name">—</strong><span id="era-sub"></span></div>
    <input type="range" id="era" min="0" max="0" value="0" aria-label="年代">
    <div class="ticks" id="ticks"></div>
    <div class="ends"><span id="end-old"></span><span id="end-new"></span></div>
    <div class="msg" id="msg" hidden></div>
  </div>

  <div class="group">
    <div class="label">写真の濃さ <span id="opacity-val">80%</span></div>
    <input type="range" id="opacity" min="0" max="100" value="80" aria-label="写真の濃さ">
  </div>

  <div class="src">
    出典: <span id="src-layer">—</span><br>
    背景地図: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
  </div>
</div>

<script>
  // ============ 配信元（調査結果: docs/spec/overseas_sources_research.md） ============
  const GSI = 'https://cyberjapandata.gsi.go.jp/xyz/';
  const SWISS = (year) => `https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage-product/default/${year}/3857/{z}/{x}/{y}.jpeg`;
  const SWISS_1946 = 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage-product_1946/default/1946/3857/{z}/{x}/{y}.jpeg';
  const IGN = (layer, fmt) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${fmt}&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}`;

  const SRC_GSI   = '<a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>';
  const SRC_SWISS = '© <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener">swisstopo</a>';
  const SRC_IGN   = '<a href="https://www.ign.fr/" target="_blank" rel="noopener">IGN</a>（Licence Ouverte 2.0）';

  // 国の判定は上から順に見る（スイスはフランスの枠と重なるので先に置く）
  const SWISS_YEARS = [1926,1927,...Array.from({length:2025-1929+1}, (_, i) => 1929 + i)];
  const COUNTRIES = [
    {
      id:'ch', name:'スイス', bounds:[[45.398181,5.140242],[48.230651,11.47757]],
      eras:[
        ...SWISS_YEARS.map(y => y === 1946
          // 1946年は時系列の層だと低いズームが白くなるので、全域をつないだ専用の層を使う
          ? { id:'ch_1946', name:'1946年', sub:'白黒・ほぼ全域', start:1946, tile:SWISS_1946, maxNativeZoom:17, blankBytes:1000 }
          : { id:'ch_'+y, name:y+'年', sub:'年ごとに写る範囲が違う', start:y, tile:SWISS(y), maxNativeZoom:20, blankBytes:1000 }),
        { id:'ch_current', name:'最新', sub:'SWISSIMAGE', start:2026, tile:SWISS('current'), maxNativeZoom:20, blankBytes:1000 },
      ],
      src:SRC_SWISS,
    },
    {
      id:'fr', name:'フランス', bounds:[[41.3,-5.2],[51.1,9.6]],
      eras:[
        { id:'fr_1950', name:'1950〜65年', sub:'白黒の空中写真', start:1950, end:1965, tile:IGN('ORTHOIMAGERY.ORTHOPHOTOS.1950-1965','image/png'), maxNativeZoom:18 },
        { id:'fr_current', name:'最新', sub:'BD ORTHO', start:2026, tile:IGN('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'), maxNativeZoom:19 },
      ],
      src:SRC_IGN,
    },
    {
      id:'jp', name:'日本', bounds:[[20,122],[46,154]],
      eras:[
        { id:'ort_1928',   name:'1928年頃',     sub:'大阪のみ',   start:1928, tile:GSI+'ort_1928/{z}/{x}/{y}.png',   maxNativeZoom:18 },
        { id:'ort_riku10', name:'1936〜42年',   sub:'東京・大阪', start:1936, end:1942, tile:GSI+'ort_riku10/{z}/{x}/{y}.png', maxNativeZoom:17 },
        { id:'ort_USA10',  name:'1945〜50年',   sub:'主要都市',   start:1945, end:1950, tile:GSI+'ort_USA10/{z}/{x}/{y}.png',  maxNativeZoom:17 },
        { id:'ort_old10',  name:'1961〜69年',   sub:'全国',       start:1961, end:1969, tile:GSI+'ort_old10/{z}/{x}/{y}.png',  maxNativeZoom:17 },
        { id:'gazo1',      name:'1974〜78年',   sub:'全国',       start:1974, end:1978, tile:GSI+'gazo1/{z}/{x}/{y}.jpg',      maxNativeZoom:17 },
        { id:'gazo2',      name:'1979〜83年',   sub:'大都市圏',   start:1979, end:1983, tile:GSI+'gazo2/{z}/{x}/{y}.jpg',      maxNativeZoom:17 },
        { id:'gazo3',      name:'1984〜86年',   sub:'大都市圏',   start:1984, end:1986, tile:GSI+'gazo3/{z}/{x}/{y}.jpg',      maxNativeZoom:17 },
        { id:'gazo4',      name:'1987〜90年',   sub:'大都市圏',   start:1987, end:1990, tile:GSI+'gazo4/{z}/{x}/{y}.jpg',      maxNativeZoom:17 },
        { id:'seamless',   name:'最新',         sub:'2004年〜現在', start:2026, tile:GSI+'seamlessphoto/{z}/{x}/{y}.jpg', maxNativeZoom:18 },
      ],
      src:SRC_GSI,
    },
  ];

  const PLACES = [
    { name:'東京',       center:[35.6812,139.7671], zoom:15 },
    { name:'チューリッヒ', center:[47.3769,8.5417],   zoom:15 },
    { name:'パリ',       center:[48.8584,2.2945],   zoom:15 },
  ];

  // B: 共通の年代。その年代に入る写真のうち、いちばん新しいものを代表にする
  const DECADES = [1920,1930,1940,1950,1960,1970,1980,1990,2000,2010,2020];
  function eraForDecade(country, decade) {
    const hits = country.eras.filter(e => {
      const s = e.start, t = e.end ?? e.start;
      return s <= decade + 9 && t >= decade && s < 2026;   // 「最新」は 2020年代にだけ使う
    });
    if (decade === 2020 && !hits.length) return country.eras.find(e => e.start === 2026) || null;
    return hits.length ? hits[hits.length - 1] : null;
  }

  // swisstopo は写真の無い所に、200 で真っ白な小さい JPEG を返す（透明にできない）。
  // fetch で中身の大きさを見て、白いタイルは隠し、「写真が無い」と数える
  const BlankAwareLayer = L.TileLayer.extend({
    createTile(coords, done) {
      const img = document.createElement('img');
      img.alt = '';
      fetch(this.getTileUrl(coords))
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(blob => {
          if (blob.size < this.options.blankBytes) {
            img.style.visibility = 'hidden';
            this.fire('tileblank');
            done(null, img);
            return;
          }
          img.onload = () => { URL.revokeObjectURL(img.src); done(null, img); };
          img.onerror = () => done(new Error('画像を読めない'), img);
          img.src = URL.createObjectURL(blob);
        })
        .catch(err => done(err, img));
      return img;
    },
  });

  // ============ 状態 ============
  const state = { mode:'A', country:null, stops:[], index:0, opacity:80, overlay:null, tiles:{ok:0, err:0, blank:0} };
  const $ = (id) => document.getElementById(id);

  const map = L.map('map', { center:PLACES[0].center, zoom:PLACES[0].zoom, maxZoom:19, zoomControl:false });
  L.control.zoom({ position:'topright' }).addTo(map);   // 左上は操作板が覆うので右へ
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);
  map.attributionControl.setPrefix(false);

  function countryAt(latlng) {
    return COUNTRIES.find(c => L.latLngBounds(c.bounds).contains(latlng)) || null;
  }

  function buildStops() {
    const c = state.country;
    if (!c) return [];
    if (state.mode === 'A') return c.eras.map(e => ({ label:e.name, era:e }));
    return DECADES.map(d => ({ label:d + '年代', era:eraForDecade(c, d) }));
  }

  // 国・並べ方が変わったら、スライダーを作り直す。なるべく近い年を選び直す
  function rebuild() {
    const prevYear = state.stops[state.index]?.era?.start ?? null;
    state.stops = buildStops();
    const n = state.stops.length;
    $('country-label').textContent = state.country ? state.country.name + ' の写真' : '写真';
    $('era').max = Math.max(n - 1, 0);
    $('era').disabled = n === 0;
    $('ticks').innerHTML = state.stops.map((s, i) =>
      `<i class="${s.era ? '' : 'off'}" style="left:${n > 1 ? i / (n - 1) * 100 : 0}%"></i>`).join('');
    $('end-old').textContent = n ? state.stops[0].label : '';
    $('end-new').textContent = n ? state.stops[n - 1].label : '';

    let idx = n - 1;
    if (prevYear !== null && n) {
      let best = Infinity;
      state.stops.forEach((s, i) => {
        if (!s.era) return;
        const d = Math.abs(s.era.start - prevYear);
        if (d < best) { best = d; idx = i; }
      });
    }
    state.index = Math.max(idx, 0);
    $('era').value = state.index;
    show();
  }

  function setMessage(text) {
    $('msg').hidden = !text;
    $('msg').textContent = text || '';
  }

  function show() {
    if (state.overlay) { map.removeLayer(state.overlay); state.overlay = null; }
    state.tiles = { ok:0, err:0, blank:0 };
    const stop = state.stops[state.index];

    if (!state.country) {
      $('era-name').textContent = '—';
      $('era-sub').textContent = '';
      $('src-layer').textContent = '—';
      setMessage('この試作は日本・スイス・フランスの写真だけです。上の「場所」から移動してください。');
      return;
    }
    $('era-name').textContent = stop.label;
    if (!stop.era) {
      $('era-sub').textContent = '';
      $('src-layer').textContent = '—';
      setMessage(`${state.country.name}には、この年代の写真がありません。`);
      return;
    }
    const e = stop.era;
    $('era-sub').textContent = state.mode === 'B' && e.name !== stop.label ? `${e.name}の写真・${e.sub}` : e.sub;
    $('src-layer').innerHTML = state.country.src;
    setMessage('');

    const opts = {
      maxZoom:19, maxNativeZoom:Math.min(e.maxNativeZoom, 19),
      bounds:state.country.bounds, opacity:state.opacity / 100,
    };
    const layer = e.blankBytes ? new BlankAwareLayer(e.tile, { ...opts, blankBytes:e.blankBytes }) : L.tileLayer(e.tile, opts);
    layer.on('tileblank', () => { state.tiles.blank++; });
    // 動かすたびに数え直す（前の場所の結果でお知らせを出さない）
    layer.on('loading', () => {
      state.tiles = { ok:0, err:0, blank:0 };
      if (state.overlay === layer) setMessage('');
    });
    layer.on('tileload', () => { state.tiles.ok++; });
    layer.on('tileerror', () => { state.tiles.err++; });
    // 表示中のタイルが1枚も読めなかったときだけ知らせる（一部の欠けは撮影範囲外のことが多い）
    layer.on('load', () => {
      if (state.overlay !== layer) return;
      const t = state.tiles;
      if (t.err > 0 && t.ok === 0) {
        setMessage('写真を読み込めませんでした。配信元が混んでいるか、止まっている可能性があります。');
      } else if (t.ok > 0 && t.blank === t.ok) {
        setMessage('この場所には、この年の写真がありません。別の年を選ぶか、ズームを変えてみてください。');
      }
    });
    layer.addTo(map);
    state.overlay = layer;
  }

  function onMove() {
    const c = countryAt(map.getCenter());
    if (c !== state.country) { state.country = c; rebuild(); }
  }

  // ============ 操作 ============
  PLACES.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = p.name;
    b.addEventListener('click', () => map.setView(p.center, p.zoom));
    $('places').appendChild(b);
  });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    state.mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    rebuild();
  }));

  $('era').addEventListener('input', (ev) => { state.index = Number(ev.target.value); show(); });

  $('opacity').addEventListener('input', (ev) => {
    state.opacity = Number(ev.target.value);
    $('opacity-val').textContent = state.opacity + '%';
    if (state.overlay) state.overlay.setOpacity(state.opacity / 100);
  });

  map.on('moveend', onMove);
  onMove();

  // 自動テスト用に、地図と今の状態を読めるようにしておく
  window.__overseasMap = map;
  window.__overseas = () => ({
    mode:state.mode, country:state.country?.id ?? null,
    stops:state.stops.map(s => s.era ? s.era.id : null), index:state.index,
    layer:state.stops[state.index]?.era?.id ?? null, tiles:{ ...state.tiles },
  });
</script>
</body>
</html>
